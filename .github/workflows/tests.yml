name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify asset cache stamps
        run: node tools/stamp_assets.cjs --check
      - name: Run test suite
        run: node --test "tests_js/*.test.*js"
